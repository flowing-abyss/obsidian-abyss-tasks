name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # cssnano 9 and jsdom 30 require Node ^22.22.3 / ^24.15.0 / >=26.
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
        with:
          # Compare the complete push/PR, including commits before a final version bump.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify changed content
        id: verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run ci
      - name: Obsidian community preflight
        if: matrix.node-version == '24.x'
        uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d # v1
        with:
          type: plugin
          mode: pr
          strict: 'true'
          # Our gate owns lint and build; this action adds repository/metadata/bundle checks.
          build: 'false'
          lint: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-messages:
    name: Commit messages
    # The commit-msg hook already cleans agent attribution out of local
    # commits; this catches the ones that skipped it (--no-verify, commits
    # made through the GitHub API) before they can be merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for agent attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .ai/hooks/strip-agent-attribution.mjs --check "$BASE_SHA..$HEAD_SHA"
