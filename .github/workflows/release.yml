name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history (and tags) is required by the changelog-builder step below —
          # a shallow checkout leaves it only the tagged commit itself, which it then
          # misreads as the repo's root commit, producing an empty "no changes" log.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Verify and build plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run ci --release

      - name: Obsidian community preflight
        uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d # v1
        with:
          type: plugin
          # Keep attestation, shipped dist/styles.css and draft creation in this workflow.
          mode: pr
          strict: 'true'
          build: 'false'
          lint: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            dist/styles.css

      - name: Build changelog from commits
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: 'COMMIT'
          configurationJson: |
            {
              "label_extractor": [{
                "pattern": "^(\\w+)(\\([\\w\\-\\.]+\\))?(!)?: .+",
                "on_property": "title",
                "target": "$1"
              }],
              "categories": [
                { "title": "## 🚀 New features", "labels": ["feat"] },
                { "title": "## 🛠️ Fixes", "labels": ["fix"] },
                { "title": "## 👾 Other", "labels": [] }
              ],
              "ignore_labels": ["release", "chore"]
            }

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.changelog }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --notes "$RELEASE_NOTES" \
            main.js manifest.json dist/styles.css
