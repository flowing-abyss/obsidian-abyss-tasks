packages:
  - .

minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
blockExoticSubdeps: true
saveExact: true
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-obsidianmd@0.4.2>obsidian': '1.14.4'
allowedDeprecatedVersions:
  eslint: '9.39.5'

# GitHub withdrew this braces advisory on 2026-10-23 as not practically exploitable.
# The npm audit feed still reports it; remove this existing exception when the feed catches up.
# https://github.com/advisories/GHSA-vfj7-8cjw-p6xm
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@parcel/watcher': false
  classic-level: true
  esbuild: true
  unrs-resolver: true
