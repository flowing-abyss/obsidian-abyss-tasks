packages:
  - .

minimumReleaseAge: 1440
# Reviewed metadata-cache fixes; exempt only this exact test-only release.
minimumReleaseAgeExclude:
  - obsidian-test-mocks@7.2.1
blockExoticSubdeps: true
saveExact: true
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-obsidianmd@0.4.2>obsidian': '1.14.4'
allowedDeprecatedVersions:
  eslint: '9.39.5'
# GHSA-4p3w-j4w9-5jqw: obsidian-test-mocks@7.2.1 still pins moment 2.29.4 exactly.
# Obsidian@1.14.4 uses 2.31.0, including the lint plugin's resolved Obsidian peer.
# The shipped plugin uses the host's Moment. Remove once the mocks admit 2.31.0 or later.
overrides:
  'moment@>=2.29.2 <2.31.0': '2.31.0'

# Temporary acceptance of GHSA-vfj7-8cjw-p6xm in dev-only braces 3.0.3 (Stylelint).
# Nested external glob patterns can exhaust the stack; current lint inputs are trusted paths.
# Remove after adopting an official compatible patched braces resolution.
# Manual review due 2026-10-17 (no automatic expiry); revisit sooner for runtime/untrusted patterns.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@parcel/watcher': false
  classic-level: true
  esbuild: true
  unrs-resolver: true
