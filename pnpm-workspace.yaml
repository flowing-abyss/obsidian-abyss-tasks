packages:
  - .

minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
blockExoticSubdeps: true
saveExact: true
strictPeerDependencies: true
allowedDeprecatedVersions:
  eslint: '9.39.5'

audit:
  ignore:
    # Reviewed 2026-11-04: minimatch is confined to development tooling. Its 8/9/10
    # callers use the default optimizationLevel 1; this DoS requires level >= 2.
    # Version 3 lacks the affected preprocessing. No production dependency uses it.
    # A global v11 override would remove makeRe(), used by eslint-plugin-import.
    # Reassess on dependency/glob-input changes; remove when callers support patched versions.
    # https://github.com/advisories/GHSA-g3hv-75wg-m249
    - GHSA-g3hv-75wg-m249

allowBuilds:
  '@parcel/watcher': false
  classic-level: true
  esbuild: true
  unrs-resolver: true
patchedDependencies:
  '@ai-sdk/provider-utils@5.0.82': patches/@ai-sdk__provider-utils@5.0.82.patch
  '@openrouter/ai-sdk-provider@3.1.0': patches/@openrouter__ai-sdk-provider@3.1.0.patch
